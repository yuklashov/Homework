<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368"><rect width="1200" height="368" rx="12" fill="#152034"/><g font-family="monospace"><text x="32" y="48" fill="#ffcb6b" font-size="18">УЧЕБНЫЙ ПРИМЕР / НЕ РЕАЛЬНЫЙ ЗАПУСК</text><text x="32" y="80" fill="#d7e3ff" font-size="17">HAProxy / учебный ожидаемый результат</text><text x="32" y="112" fill="#d7e3ff" font-size="17"></text><text x="32" y="144" fill="#d7e3ff" font-size="17">L4 TCP :8080 -&gt; web1:8001 / web2:8002, roundrobin 1:1</text><text x="32" y="176" fill="#d7e3ff" font-size="17">L7 HTTP :8081 -&gt; web1/web2/web3, weights 2:3:4</text><text x="32" y="208" fill="#d7e3ff" font-size="17">Host example.local -&gt; weighted backend</text><text x="32" y="240" fill="#d7e3ff" font-size="17">Host 127.0.0.1 или other.local -&gt; ожидается HTTP 403</text><text x="32" y="272" fill="#d7e3ff" font-size="17">Модель 90 назначений: web1=20, web2=30, web3=40</text><text x="32" y="304" fill="#d7e3ff" font-size="17">Это расчёт на Python. HAProxy и HTTP-запросы не запускались.</text></g></svg>