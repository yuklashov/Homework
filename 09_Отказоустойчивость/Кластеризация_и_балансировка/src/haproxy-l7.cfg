global
    maxconn 128

defaults
    mode http
    timeout connect 3s
    timeout client 15s
    timeout server 15s
    option http-server-close

frontend l7_in
    bind 127.0.0.1:8081
    acl example_host hdr(host),lower,field(1,:) -m str example.local
    http-request deny deny_status 403 unless example_host
    default_backend python_weighted

backend python_weighted
    balance roundrobin
    option httpchk GET /
    http-check expect status 200
    server web1 127.0.0.1:8001 check weight 2
    server web2 127.0.0.1:8002 check weight 3
    server web3 127.0.0.1:8003 check weight 4
