global
    maxconn 128

defaults
    mode tcp
    timeout connect 3s
    timeout client 15s
    timeout server 15s

frontend l4_in
    bind 127.0.0.1:8080
    default_backend python_pair

backend python_pair
    balance roundrobin
    server web1 127.0.0.1:8001 check
    server web2 127.0.0.1:8002 check
