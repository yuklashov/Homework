<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368"><rect width="1200" height="368" rx="12" fill="#152034"/><g font-family="monospace"><text x="32" y="48" fill="#ffcb6b" font-size="18">УЧЕБНЫЙ ПРИМЕР / НЕ РЕАЛЬНЫЙ ЗАПУСК</text><text x="32" y="80" fill="#d7e3ff" font-size="17">rsync / локальная проверка без VM</text><text x="32" y="112" fill="#d7e3ff" font-size="17"></text><text x="32" y="144" fill="#d7e3ff" font-size="17">TASK 1: hidden directories excluded; .profile retained</text><text x="32" y="176" fill="#d7e3ff" font-size="17">Same size + same mtime: изменение AAAA -&gt; BBBB обнаружено</text><text x="32" y="208" fill="#d7e3ff" font-size="17">Mirror: лишний obsolete.txt удалён только во временной копии</text><text x="32" y="240" fill="#d7e3ff" font-size="17">TASK 2: полный набор, включая скрытые каталоги</text><text x="32" y="272" fill="#d7e3ff" font-size="17">SUCCESS/FAIL: записаны в тестовый logger-файл</text><text x="32" y="304" fill="#d7e3ff" font-size="17">Cron и Linux syslog не установлены/не проверялись.</text></g></svg>