<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368"><rect width="1200" height="368" rx="12" fill="#152034"/><g font-family="monospace"><text x="32" y="48" fill="#ffcb6b" font-size="18">УЧЕБНЫЙ ПРИМЕР / НЕ РЕАЛЬНЫЙ ЗАПУСК</text><text x="32" y="80" fill="#d7e3ff" font-size="17">Jenkins: схема подготовленной конфигурации</text><text x="32" y="112" fill="#d7e3ff" font-size="17"></text><text x="32" y="144" fill="#d7e3ff" font-size="17">Freestyle: SCM -&gt; go test . -&gt; docker build .</text><text x="32" y="176" fill="#d7e3ff" font-size="17">Pipeline Docker: Checkout -&gt; Test -&gt; Docker build</text><text x="32" y="208" fill="#d7e3ff" font-size="17">Pipeline Nexus: Checkout -&gt; Test -&gt; Binary -&gt; Upload</text><text x="32" y="240" fill="#d7e3ff" font-size="17">Credentials: Jenkins ID nexus-upload (значения не в коде)</text><text x="32" y="272" fill="#d7e3ff" font-size="17">Версия артефакта: main-${BUILD_NUMBER}</text><text x="32" y="304" fill="#d7e3ff" font-size="17">Docker-stage и новые Jenkinsfile здесь не выполнялись.</text></g></svg>