<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="432" viewBox="0 0 1200 432"><rect width="1200" height="432" rx="12" fill="#152034"/><g font-family="monospace"><text x="32" y="48" fill="#ffcb6b" font-size="18">УЧЕБНЫЙ ПРИМЕР / НЕ РЕАЛЬНЫЙ ЗАПУСК</text><text x="32" y="80" fill="#d7e3ff" font-size="17">ispmanager / учебные настройки безопасности</text><text x="32" y="112" fill="#d7e3ff" font-size="17"></text><text x="32" y="144" fill="#d7e3ff" font-size="17">Панель: HTTPS, отдельный superadmin; сайты у user-a/user-b</text><text x="32" y="176" fill="#d7e3ff" font-size="17">Закрытый /private: авторизация; копия сайта перед изменениями</text><text x="32" y="208" fill="#d7e3ff" font-size="17">Backup: 04:00 | 2 full + 2 daily | /var/mybackups/ | 3 ГБ</text><text x="32" y="240" fill="#d7e3ff" font-size="17">HTTP: 10 req/s, burst 20 | AV: выбран ClamAV, не запускался</text><text x="32" y="272" fill="#d7e3ff" font-size="17">Fail2ban: maxretry 3, bantime 36000 | SSH 2222, root no</text><text x="32" y="304" fill="#d7e3ff" font-size="17">Firewall: TCP143 deny 8.8.1.1; any deny 9.10.11.12</text><text x="32" y="336" fill="#d7e3ff" font-size="17">UDP80 deny с исключениями оператора и 15.15.4.5</text><text x="32" y="368" fill="#d7e3ff" font-size="17">Учебные файлы не применены к действующей системе.</text></g></svg>