<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><rect width="1200" height="400" rx="12" fill="#152034"/><g font-family="monospace"><text x="32" y="48" fill="#ffcb6b" font-size="18">УЧЕБНЫЙ ПРИМЕР / НЕ РЕАЛЬНЫЙ ЗАПУСК</text><text x="32" y="80" fill="#d7e3ff" font-size="17">ispmanager / учебная форма прав</text><text x="32" y="112" fill="#d7e3ff" font-size="17"></text><text x="32" y="144" fill="#d7e3ff" font-size="17">superadmin: Администратор, Суперпользователь = да</text><text x="32" y="176" fill="#d7e3ff" font-size="17">admin: Администратор, Суперпользователь = нет</text><text x="32" y="208" fill="#d7e3ff" font-size="17">user: диск 2000 МБ; базы данных 2</text><text x="32" y="240" fill="#d7e3ff" font-size="17">SSL: да | CGI: нет | PHP module Apache: да</text><text x="32" y="272" fill="#d7e3ff" font-size="17">PHP CGI: нет | Nginx+PHP-FPM: нет | shell: да</text><text x="32" y="304" fill="#d7e3ff" font-size="17">CRON / DNS / Резервные копии: доступ запрещён</text><text x="32" y="336" fill="#d7e3ff" font-size="17">Установка и создание аккаунтов здесь не выполнялись.</text></g></svg>