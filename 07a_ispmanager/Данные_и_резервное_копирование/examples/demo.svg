<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><rect width="1200" height="400" rx="12" fill="#152034"/><g font-family="monospace"><text x="32" y="48" fill="#ffcb6b" font-size="18">УЧЕБНЫЙ ПРИМЕР / НЕ РЕАЛЬНЫЙ ЗАПУСК</text><text x="32" y="80" fill="#d7e3ff" font-size="17">ispmanager / состояния восстановления</text><text x="32" y="112" fill="#d7e3ff" font-size="17"></text><text x="32" y="144" fill="#d7e3ff" font-size="17">1. Пользователи: netology, ispmanager | shell: запрещён</text><text x="32" y="176" fill="#d7e3ff" font-size="17">2. Сайт: wp.example.test | владелец: netology</text><text x="32" y="208" fill="#d7e3ff" font-size="17">3. До сбоя: файлы + SQL + системная копия netology</text><text x="32" y="240" fill="#d7e3ff" font-size="17">4. После локального восстановления: передача -&gt; ispmanager</text><text x="32" y="272" fill="#d7e3ff" font-size="17">5. Второй сбой: ispmanager удалён (учебное состояние)</text><text x="32" y="304" fill="#d7e3ff" font-size="17">6. Из системной копии: владелец -&gt; netology</text><text x="32" y="336" fill="#d7e3ff" font-size="17">Реальная панель и WordPress в этом сеансе не запускались.</text></g></svg>