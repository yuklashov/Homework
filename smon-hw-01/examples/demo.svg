<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368"><rect width="1200" height="368" rx="12" fill="#152034"/><g font-family="monospace"><text x="32" y="48" fill="#ffcb6b" font-size="18">УЧЕБНЫЙ ПРИМЕР / НЕ РЕАЛЬНЫЙ ЗАПУСК</text><text x="32" y="80" fill="#d7e3ff" font-size="17">Yandex Monitoring / учебная форма</text><text x="32" y="112" fill="#d7e3ff" font-size="17"></text><text x="32" y="144" fill="#d7e3ff" font-size="17">VM: 2 vCPU, гарантированная доля 20% (не создавалась)</text><text x="32" y="176" fill="#d7e3ff" font-size="17">Dashboard: compute / cpu_utilization / выбранная VM</text><text x="32" y="208" fill="#d7e3ff" font-size="17">cpu-warn: mean(5m), threshold &gt;15 -&gt; WARN</text><text x="32" y="240" fill="#d7e3ff" font-size="17">cpu-alarm: mean(5m), threshold &gt;18 -&gt; ALARM</text><text x="32" y="272" fill="#d7e3ff" font-size="17">Email-канал: выбранный участник (не создан, писем не было)</text><text x="32" y="304" fill="#d7e3ff" font-size="17">No data -&gt; NO_DATA; график здесь не является телеметрией</text></g></svg>