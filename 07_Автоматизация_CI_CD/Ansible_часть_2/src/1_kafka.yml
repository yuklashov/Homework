---
- name: Download and unpack the archive (adapted from the March solution)
  hosts: lab
  become: true
  gather_facts: false
  vars:
    kafka_version: "3.6.1"
    kafka_archive: "kafka_2.13-{{ kafka_version }}.tgz"
    kafka_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/{{ kafka_archive }}"
    kafka_directory: "/opt/kafka/{{ kafka_version }}"
  tasks:
    - name: Create directory for Kafka
      ansible.builtin.file:
        path: "{{ kafka_directory }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Download Kafka archive
      ansible.builtin.get_url:
        url: "{{ kafka_url }}"
        dest: "/var/tmp/{{ kafka_archive }}"
        mode: '0644'
    - name: Unpack Kafka archive once
      ansible.builtin.unarchive:
        src: "/var/tmp/{{ kafka_archive }}"
        dest: "{{ kafka_directory }}"
        remote_src: true
        extra_opts: ['--strip-components=1']
        creates: "{{ kafka_directory }}/bin/kafka-topics.sh"
