<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368"><rect width="1200" height="368" rx="12" fill="#152034"/><g font-family="monospace"><text x="32" y="48" fill="#ffcb6b" font-size="18">УЧЕБНЫЙ ПРИМЕР / НЕ РЕАЛЬНЫЙ ЗАПУСК</text><text x="32" y="80" fill="#d7e3ff" font-size="17">Zabbix / основные задания 1–4</text><text x="32" y="112" fill="#d7e3ff" font-size="17"></text><text x="32" y="144" fill="#d7e3ff" font-size="17">Template Zadanie_1 / Задание 1: CPU % + RAM %</text><text x="32" y="176" fill="#d7e3ff" font-size="17">CPU = 100-idle | RAM = 100-pavailable | interval 30s</text><text x="32" y="208" fill="#d7e3ff" font-size="17">Host yuklashovam-1 -&gt; Zadanie_1</text><text x="32" y="240" fill="#d7e3ff" font-size="17">Host yuklashovam-2 -&gt; Zadanie_1</text><text x="32" y="272" fill="#d7e3ff" font-size="17">Dashboard Задание 4: CPU/RAM каждого из двух хостов</text><text x="32" y="304" fill="#d7e3ff" font-size="17">Импорт, зелёные статусы и новые значения здесь не получены.</text></g></svg>